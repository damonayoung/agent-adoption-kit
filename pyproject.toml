[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aak"
version = "0.1.0"
description = "Adoption telemetry for enterprise AI agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
    "plotly>=7.0.0",
    "kaleido>=1.4.0",
    "pyyaml>=6.0.3",
    "cairosvg>=2.9.0",
]

[project.optional-dependencies]
# The Anthropic SDK is needed only by `aak report` in its default theme; the deterministic
# `--theme paper` path, `simulate`, and `analyze` never import it.
report = ["anthropic>=1.4.0"]
dev = ["pytest", "anthropic>=1.4.0"]

[project.scripts]
aak = "aak.cli:app"

[tool.setuptools.packages.find]
include = ["aak*"]

[tool.setuptools.package-data]
aak = ["analytics/thresholds.yaml", "report/assets/fonts/*.woff2"]
