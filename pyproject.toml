[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aak"
version = "0.1.0"
description = "Adoption telemetry for enterprise AI agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "sqlalchemy",
    "typer",
    "plotly",
    "kaleido",
    "anthropic",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
aak = "aak.cli:app"

[tool.setuptools.packages.find]
include = ["aak*"]

[tool.setuptools.package-data]
aak = ["analytics/thresholds.yaml", "report/assets/fonts/*.woff2"]
